<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aggiungi Arnia</title><script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
    <nav class="bg-slate-900 p-4 sticky top-0 z-50 shadow-md flex items-center gap-4">
        <a href="javascript:history.back()" class="text-white font-bold text-xl">✕</a>
        <div>
            <h1 class="font-black uppercase text-white tracking-tight">Nuova Cassa</h1>
            <p class="text-[10px] text-slate-400 font-bold uppercase">{{ apiario.luogo }}</p>
        </div>
    </nav>

    <main class="p-6 max-w-xl mx-auto space-y-6">
        <form method="POST" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase mb-2 ml-1">Numero / Identificativo</label>
                {{ form.codice_identificativo }}
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-2 ml-1">Tipo di Cassa</label>
                    {{ form.categoria }}
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-2 ml-1">Colore</label>
                    {{ form.colore }}
                </div>
            </div>

            <button type="submit" class="w-full bg-yellow-400 text-slate-900 py-5 rounded-3xl font-black uppercase text-lg shadow-xl active:scale-95 transition-transform mt-8">
                Salva Arnia
            </button>
        </form>
    </main>
</body>
</html>
