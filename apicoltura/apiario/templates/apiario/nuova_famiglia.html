<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inserisci Famiglia</title><script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="date"], select { outline: none; }
        .tool-active { ring: 4px; ring-color: #3b82f6; transform: scale(1.1); z-index: 10; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-10">
    <nav class="bg-green-500 p-4 sticky top-0 z-50 shadow-md flex items-center gap-4">
        <a href="javascript:history.back()" class="text-white font-bold text-xl">✕</a>
        <div>
            <h1 class="font-black uppercase text-white tracking-tight">Popola Arnia {{ arnia.codice_identificativo }}</h1>
        </div>
    </nav>

    <main class="p-4 max-w-xl mx-auto space-y-6">
        <form method="POST" class="space-y-6">
            {% csrf_token %}
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-2 ml-1">Data Inserimento</label>
                    {{ form.data_inserimento }}
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-2 ml-1">Origine Api</label>
                    {{ form.origine }}
                </div>
            </div>
            
            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase mb-2 ml-1">Indole della Famiglia</label>
                {{ form.indole }}
            </div>

            <!-- COMPOSIZIONE INIZIALE DEL NIDO -->
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200 mt-6">
                <p class="text-[10px] font-bold text-slate-400 uppercase mb-4 text-center tracking-widest">Componi il nido iniziale</p>
                
                <div class="flex justify-center gap-3 mb-6">
                    <button type="button" onclick="setTool('V')" id="btn-V" class="tool w-12 h-12 bg-slate-200 border-b-4 border-slate-400 rounded-xl font-black text-xs transition-all">V</button>
                    <button type="button" onclick="setTool('S')" id="btn-S" class="tool w-12 h-12 bg-yellow-400 border-b-4 border-yellow-600 rounded-xl font-black text-xs transition-all">S</button>
                    <button type="button" onclick="setTool('C')" id="btn-C" class="tool w-12 h-12 bg-red-500 border-b-4 border-red-700 rounded-xl font-black text-xs text-white ring-4 ring-blue-500 scale-110 transition-all">C</button>
                    <button type="button" onclick="setTool('F')" id="btn-F" class="tool w-12 h-12 bg-blue-300 border-b-4 border-blue-500 rounded-xl font-black text-xs text-blue-900 transition-all">F</button>
                </div>

                <input type="hidden" name="disposizione_telai" id="id_disposizione_telai" value="{{ disposizione_vuota }}">
                
                <div class="flex justify-center gap-1 bg-slate-100 p-2 rounded-lg border-x-4 border-slate-300 shadow-inner">
                    <!-- LOGICA DINAMICA 6/10 TELAI -->
                    {% for i in range_telai %}
                    <div id="t-{{ forloop.counter0 }}" onclick="paint('{{ forloop.counter0 }}')" class="flex-1 h-24 rounded-sm border-t-4 border-slate-300 bg-slate-200 cursor-pointer flex items-center justify-center text-xs font-black transition-all"></div>
                    {% endfor %}
                </div>
            </div>

            <button type="submit" class="w-full bg-slate-900 text-green-400 py-5 rounded-3xl font-black uppercase text-lg shadow-2xl tracking-widest active:scale-95 transition-transform">
                Salva & Popola
            </button>
        </form>
    </main>

    <script>
        let currentTool = 'C';
        let config = Array.from("{{ disposizione_vuota|safe }}");
        
        const styles = { 'V': 'bg-slate-200 border-slate-400 text-slate-500', 'S': 'bg-yellow-400 border-yellow-600 text-yellow-900', 'C': 'bg-red-500 border-red-700 text-white', 'F': 'bg-blue-300 border-blue-500 text-blue-900' };

        function setTool(t) {
            currentTool = t;
            document.querySelectorAll('.tool').forEach(b => b.classList.remove('ring-4', 'ring-blue-500', 'scale-110'));
            document.getElementById('btn-' + t).classList.add('ring-4', 'ring-blue-500', 'scale-110');
        }

        function paint(i) {
            config[i] = (config[i] === currentTool) ? 'V' : currentTool;
            updateDisplay();
        }

        function updateDisplay() {
            config.forEach((s, i) => {
                const el = document.getElementById('t-' + i);
                if(el) {
                    el.className = `flex-1 h-24 rounded-sm border-t-4 transition-all flex items-center justify-center text-xs font-black ${styles[s]}`;
                    el.innerText = s === 'V' ? '' : s;
                }
            });
            document.getElementById('id_disposizione_telai').value = config.join('');
        }

        setTool('C');
        updateDisplay();
    </script>
</body>
</html>
