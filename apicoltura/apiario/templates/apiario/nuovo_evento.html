<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuovo Evento</title><script src="https://cdn.tailwindcss.com"></script>
    <style>input[type="date"], select { outline: none; }</style>
</head>
<body class="bg-slate-50 min-h-screen pb-10">
    <nav class="{% if edit_mode %}bg-blue-600{% else %}bg-pink-500{% endif %} p-4 sticky top-0 z-50 shadow-md flex items-center gap-4">
        <a href="javascript:history.back()" class="text-white font-bold text-xl">✕</a>
        <div>
            <h1 class="font-black uppercase text-white tracking-tight">
                {% if edit_mode %}Modifica Evento{% else %}Nuovo Evento{% endif %}
            </h1>
        </div>
    </nav>

    <main class="p-4 max-w-xl mx-auto space-y-6 mt-4">
        <form method="POST" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase mb-2 ml-1">Giorno dell'evento</label>
                {{ form.data }}
            </div>
            
            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase mb-2 ml-1">Titolo (Es. Posa Melari)</label>
                {{ form.titolo }}
            </div>

            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase mb-2 ml-1">Categoria</label>
                {{ form.tipo }}
            </div>

            <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-200">
                <label class="block text-[10px] font-bold text-slate-400 uppercase mb-2 ml-1">Note (Opzionale)</label>
                {{ form.note }}
            </div>

            <button type="submit" class="w-full bg-slate-900 text-pink-400 py-5 rounded-3xl font-black uppercase text-lg shadow-2xl tracking-widest active:scale-95 transition-transform">
                Salva in Agenda
            </button>
            <button type="submit" class="w-full bg-slate-900 text-white py-5 rounded-3xl font-black uppercase text-lg shadow-xl tracking-widest active:scale-95 transition-transform">
                {% if edit_mode %}Aggiorna Impegno{% else %}Salva in Agenda{% endif %}
            </button>
        </form>
    </main>
</body>
</html>
