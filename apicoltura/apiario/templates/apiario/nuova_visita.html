<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuova Visita - Arnia {{ famiglia.arnia.codice_identificativo }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="date"], textarea { width: 100%; border: 1px solid #e2e8f0; border-radius: 0.75rem; padding: 0.75rem; outline: none; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-10">

    <nav class="bg-yellow-400 p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
        <a href="javascript:history.back()" class="text-slate-900 text-xl font-bold">✕</a>
        <h1 class="font-black uppercase text-slate-900 tracking-tight text-sm">Registra Ispezione</h1>
        <div class="w-5"></div>
    </nav>

    <main class="p-4 max-w-xl mx-auto space-y-6">

        <form method="POST" class="space-y-6">
            {% csrf_token %}

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-2">Data</label>
                    {{ form.data_visita }}
                </div>
                
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-2">N. Melari</label>
                    <div class="flex items-center gap-3">
                        <button type="button" onclick="cambiaMelari(-1)" class="w-8 h-8 bg-slate-100 rounded-full font-black text-slate-600 active:bg-slate-200">-</button>
                        <input type="number" name="numero_melari" id="id_numero_melari" value="{{ form.numero_melari.value|default:0 }}" readonly class="w-6 text-center font-black bg-transparent border-none p-0 focus:ring-0">
                        <button type="button" onclick="cambiaMelari(1)" class="w-8 h-8 bg-orange-400 text-white rounded-full font-black shadow-sm active:bg-orange-500">+</button>
                    </div>
                </div>
            </div>

            <!-- EDITOR GRAFICO (PENNELLO) -->
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200">
                <p class="text-[10px] font-bold text-slate-400 uppercase mb-4 text-center tracking-widest">Mappa del Nido</p>
                
                <div class="flex justify-center gap-3 mb-6">
                    <button type="button" onclick="setTool('V')" id="btn-V" class="tool w-12 h-12 bg-slate-200 border-b-4 border-slate-400 rounded-xl font-black text-xs transition-all">V</button>
                    <button type="button" onclick="setTool('S')" id="btn-S" class="tool w-12 h-12 bg-yellow-400 border-b-4 border-yellow-600 rounded-xl font-black text-xs transition-all">S</button>
                    <button type="button" onclick="setTool('C')" id="btn-C" class="tool w-12 h-12 bg-red-500 border-b-4 border-red-700 rounded-xl font-black text-xs text-white transition-all ring-4 ring-blue-500 scale-110">C</button>
                    <button type="button" onclick="setTool('F')" id="btn-F" class="tool w-12 h-12 bg-blue-300 border-b-4 border-blue-500 rounded-xl font-black text-xs text-blue-900 transition-all">F</button>
                </div>

                <input type="hidden" name="disposizione_telai" id="id_disposizione_telai" value="{{ disposizione_precedente }}">
                
                <div class="flex justify-center gap-1 bg-slate-100 p-2 rounded-lg border-x-4 border-slate-300 shadow-inner">
                    <!-- QUI C'È LA LOGICA DEL RANGE DINAMICO -->
                    {% for i in range_telai %}
                    <div id="t-{{ forloop.counter0 }}" onclick="paint('{{ forloop.counter0 }}')" class="flex-1 h-24 rounded-sm border-t-4 border-slate-300 bg-slate-200 cursor-pointer flex items-center justify-center text-xs font-black transition-all"></div>
                    {% endfor %}
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <label class="flex flex-col items-center justify-center p-5 bg-white rounded-2xl border border-slate-200 shadow-sm cursor-pointer active:bg-slate-50">
                    <span class="text-[10px] font-bold text-slate-400 uppercase mb-3">Celle Reali?</span>
                    {{ form.presenza_celle_reali }}
                </label>
                <label class="flex flex-col items-center justify-center p-5 bg-white rounded-2xl border border-slate-200 shadow-sm cursor-pointer active:bg-slate-50">
                    <span class="text-[10px] font-bold text-slate-400 uppercase mb-3">Covata Fresca?</span>
                    {{ form.presenza_covata_fresca }}
                </label>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <label class="block text-[10px] font-bold text-slate-400 uppercase mb-2 ml-1">Note Libere</label>
                {{ form.note }}
            </div>

            <button type="submit" class="w-full bg-slate-900 text-yellow-400 py-5 rounded-3xl font-black uppercase text-lg shadow-2xl tracking-widest active:scale-95 transition-all">
                Salva Ispezione
            </button>
        </form>
    </main>

    <script>
        // Logica Melari
        function cambiaMelari(delta) {
            let input = document.getElementById('id_numero_melari');
            let val = parseInt(input.value) || 0;
            val += delta;
            if (val < 0) val = 0;
            if (val > 5) val = 5; // Limite di sicurezza
            input.value = val;
        }

        // Logica Grafica Telaini (Toggle system)
        let currentTool = 'C';
        let config = Array.from("{{ disposizione_precedente|safe }}");
        
        const styles = { 
            'V': 'bg-slate-200 border-slate-400 text-slate-500', 
            'S': 'bg-yellow-400 border-yellow-600 text-yellow-900', 
            'C': 'bg-red-500 border-red-700 text-white', 
            'F': 'bg-blue-300 border-blue-500 text-blue-900' 
        };

        function setTool(t) {
            currentTool = t;
            document.querySelectorAll('.tool').forEach(b => b.classList.remove('ring-4', 'ring-blue-500', 'scale-110'));
            document.getElementById('btn-' + t).classList.add('ring-4', 'ring-blue-500', 'scale-110');
        }

        function paint(i) {
            config[i] = (config[i] === currentTool) ? 'V' : currentTool;
            updateDisplay();
        }

        function updateDisplay() {
            config.forEach((s, i) => {
                const el = document.getElementById('t-' + i);
                if(el) {
                    el.className = `flex-1 h-24 rounded-sm border-t-4 transition-all flex items-center justify-center text-xs font-black ${styles[s]}`;
                    el.innerText = s === 'V' ? '' : s;
                }
            });
            document.getElementById('id_disposizione_telai').value = config.join('');
        }

        // Setup iniziale
        setTool('C');
        updateDisplay();
    </script>
</body>
</html>
